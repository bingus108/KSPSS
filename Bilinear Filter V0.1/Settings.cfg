// RenderProbe - Stage 1 render pipeline probe
// Diagnostics only. This plugin does NOT modify rendering beyond enabling
// DepthTextureMode flags and copying buffers for inspection.
//
// All keys are optional; delete any line to use its default.

RENDER_PROBE
{
	// Key that shows/hides the on-screen diagnostic overlay.
	overlayToggleKey = F11

	// Key that triggers a one-shot GPU readback: statistical analysis of the
	// captured buffers + PNG dumps into Logs/RenderProbe/. This stalls the GPU
	// for a frame, so it is manual by design.
	captureKey = F12

	// Fires a burst of captures a few frames apart. Hold a continuous camera
	// orbit and press once - at least one frame lands mid-motion.
	burstKey = F10
	burstCount = 8
	burstStrideFrames = 6

	// ---- Step B: projection jitter + temporal stability ----
	// INVASIVE: jitterToggleKey mutates Camera 00's projection matrix every frame
	// (fully restored on toggle-off / scene exit). Default OFF.
	jitterToggleKey = F9
	jitterPhases = 8

	// Runs the paired stability probe: baseline (jitter off) -> verify (jitter on)
	// -> CPU temporal accumulation. Keep the scene/camera STATIC while it runs
	// (~7 s, reduced FPS - it reads back every frame).
	stabilityKey = F8
	accumWidth = 192
	accumHeight = 108
	stabilityBaselineFrames = 90
	stabilityVerifyFrames = 90
	stabilityAccumFrames = 240

	// Motion-vector Y sign for CPU reprojection. If the accumulator won't converge,
	// try flipping this.
	motionFlipY = true

	// ---- Stage 2: render redirect + upscale ----
	// F7 renders the world camera stack into a low-res RenderTexture and composites
	// it (upscaled) onto the backbuffer before the UI. No NVIDIA code. Fully
	// reversible; default OFF.
	redirectToggleKey = F7
	renderScale = 0.67          // 1.0 = identity test (RT == native, should look unchanged)
	redirectIVA = true
	redirectMarkers = true      // markers-native is not supported by the simple compositor
	upscaleFilter = bilinear    // bilinear (no shader) | bicubic (needs renderprobe.bundle, see /unity)

	// If true, Bootstrap logs a full camera inventory (to file) on every scene
	// load - useful for studying the pipeline in the editor / KSC / map scenes.
	sceneInventoryEnabled = true

	// Overlay thumbnail edge length in pixels.
	thumbnailSize = 200

	// Seconds between automatic captures. 0 = manual only (recommended).
	autoAnalyzeInterval = 0

	// Downscaled edge length used for readback analysis (keeps the stall small).
	analysisSampleSize = 128
}
