// RenderProbe - Stage 1 render pipeline probe
// Diagnostics only. This plugin does NOT modify rendering beyond enabling
// DepthTextureMode flags and copying buffers for inspection.
//
// All keys are optional; delete any line to use its default.

RENDER_PROBE
{
	// Key that shows/hides the on-screen diagnostic overlay.
	overlayToggleKey = F11

	// Key that triggers a one-shot GPU readback: statistical analysis of the
	// captured buffers + PNG dumps into Logs/RenderProbe/. This stalls the GPU
	// for a frame, so it is manual by design.
	captureKey = F12

	// Fires a burst of captures a few frames apart. Hold a continuous camera
	// orbit and press once - at least one frame lands mid-motion.
	burstKey = F10
	burstCount = 8
	burstStrideFrames = 6

	// If true, Bootstrap logs a full camera inventory (to file) on every scene
	// load - useful for studying the pipeline in the editor / KSC / map scenes.
	sceneInventoryEnabled = true

	// Overlay thumbnail edge length in pixels.
	thumbnailSize = 200

	// Seconds between automatic captures. 0 = manual only (recommended).
	autoAnalyzeInterval = 0

	// Downscaled edge length used for readback analysis (keeps the stall small).
	analysisSampleSize = 128
}
